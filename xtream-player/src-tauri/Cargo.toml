[package]
name = "xtream-player"
version = "1.0.0"
description = "Player IPTV desktop compatibile con le API Xtream Codes"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# native-tls (Schannel su Windows): nessun toolchain extra (cmake/nasm) richiesto
reqwest = { version = "0.12", features = ["stream"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "process"] }
futures-util = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

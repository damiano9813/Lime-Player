[package]
name = "xtream-player"
version = "1.3.0"
description = "Player IPTV desktop compatibile con le API Xtream Codes"
edition = "2021"
rust-version = "1.77"

[lib]
# libreria condivisa: l'eseguibile desktop (main.rs) e l'app Android la usano entrambi
name = "xtream_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "process", "sync"] }
futures-util = "0.3"
base64 = "0.22"
# guida TV completa (xmltv.php): XML letto in streaming, file anche compressi con gzip
quick-xml = "0.42"
flate2 = "1"

# desktop: native-tls (Schannel su Windows), nessun toolchain extra (cmake/nasm) richiesto
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.12", features = ["stream"] }
# native-tls come reqwest: niente rustls/aws-lc (cmake/nasm)
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls"] }
# una sola istanza: una seconda apertura raddoppierebbe proxy e connessioni al provider
tauri-plugin-single-instance = "2"
# dimensione, posizione e stato massimizzato della finestra tra un avvio e l'altro
tauri-plugin-window-state = "2"

# Android: rustls con i certificati radice inclusi (OpenSSL non c'è nell'NDK)
[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "charset", "http2"] }

[target.'cfg(windows)'.dependencies]
# password in Gestione credenziali di Windows
keyring = { version = "3", features = ["windows-native"] }
# motore di riproduzione integrato: libmpv caricata a runtime, video in una finestra figlia nativa
libloading = "0.7"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# risposte HTTP finte per i test della riconnessione live (già usato da reqwest)
http = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

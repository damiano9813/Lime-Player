# Release firmata per l'aggiornamento automatico: si avvia con un tag "v1.2.3" (uguale a
# "version" in xtream-player/src-tauri/tauri.conf.json) o a mano da Actions.
# Segreti del repository: TAURI_SIGNING_PRIVATE_KEY (contenuto del file .key) e
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (vuoto se la chiave non ha password).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: xtream-player/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: xtream-player/src-tauri -> target

      - name: Dipendenze frontend
        working-directory: xtream-player
        run: npm ci

      - name: Test
        working-directory: xtream-player
        run: |
          npm test
          npm run fetch:ffmpeg
          cd src-tauri
          cargo test

      # beforeBuildCommand scarica ffmpeg (già presente dal passo precedente) e compila la UI
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: xtream-player
          tagName: v__VERSION__
          releaseName: Xtream Player v__VERSION__
          releaseBody: Installa con il file -setup.exe. Le versioni già installate si aggiornano da sole.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

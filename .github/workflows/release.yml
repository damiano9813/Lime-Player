# Release firmata per l'aggiornamento automatico: si avvia con un tag "v1.2.3" (uguale a
# "version" in src-tauri/tauri.conf.json) o a mano da Actions.
# Segreti del repository: TAURI_SIGNING_PRIVATE_KEY (contenuto del file .key) e
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (vuoto se la chiave non ha password).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Dipendenze frontend
        run: npm ci

      # passi separati: in pwsh conta solo il codice d'uscita dell'ultimo comando
      - name: Test frontend
        run: npm test

      - name: ffmpeg per il bundle
        run: npm run fetch:ffmpeg

      - name: Test Rust
        working-directory: src-tauri
        run: cargo test

      # beforeBuildCommand scarica ffmpeg (già presente dal passo precedente) e compila la UI
      - uses: tauri-apps/tauri-action@v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Xtream Player v__VERSION__
          releaseBody: Installa con il file -setup.exe. Le versioni già installate si aggiornano da sole.
          # pubblicata subito: le app installate la vedono al prossimo avvio (i test sopra fanno da filtro)
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

      # latest.json di tauri-action punta all'API di GitHub (releases/assets/<id>), che senza token
      # risponde 403 oltre le 60 richieste l'ora per IP: si passa ai link di download diretti
      - name: Link diretti in latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.tauri.outputs.appVersion }}
        run: |
          mkdir -p updater
          gh release download "$TAG" --pattern latest.json --dir updater --clobber
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .assets > updater/assets.json
          node scripts/fix-updater-json.mjs updater/latest.json updater/assets.json
          gh release upload "$TAG" updater/latest.json --clobber
